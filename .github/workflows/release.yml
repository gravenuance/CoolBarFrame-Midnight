name: Release

on:
  push:
    tags:
      - "v*.*" # matches this project's X.Y (0.3) and X.Y.Z versioning alike

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for version ${{ steps.version.outputs.version }}." > release-notes.md
          fi

      - name: Package addon
        run: |
          mkdir -p dist/CoolBarFrame
          cp CoolBarFrame.toc CoolBarFrame.lua Core.lua CoolBarOptions.lua README.md dist/CoolBarFrame/
          cd dist
          zip -r "CoolBarFrame-${{ steps.version.outputs.version }}.zip" CoolBarFrame

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/CoolBarFrame-${{ steps.version.outputs.version }}.zip" \
            --title "CoolBarFrame ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
