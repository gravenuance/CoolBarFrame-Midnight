name: Release

on:
  push:
    tags:
      - "v*.*" # matches this project's X.Y (0.3) and X.Y.Z versioning alike

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation
      attestations: write # store it
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Derive version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for version $VERSION." > release-notes.md
          fi

      # Commit-time file dates, sorted entries and no extra attributes, so the same tag gives the same zip.
      - name: Package addon
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/CoolBarFrame
          cp CoolBarFrame.toc CoolBarLogic.lua CoolBarFrame.lua Core.lua CoolBarOptions.lua README.md dist/CoolBarFrame/
          touch -d "@$(git log -1 --format=%ct)" dist/CoolBarFrame dist/CoolBarFrame/*
          cd dist
          find CoolBarFrame | LC_ALL=C sort | zip -X -@ "CoolBarFrame-$VERSION.zip"
          sha256sum "CoolBarFrame-$VERSION.zip" > "CoolBarFrame-$VERSION.zip.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/CoolBarFrame-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$REF_NAME" \
            "dist/CoolBarFrame-$VERSION.zip" \
            "dist/CoolBarFrame-$VERSION.zip.sha256" \
            --title "CoolBarFrame $VERSION" \
            --notes-file release-notes.md
